
name: Extract LVNG-X Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q LVNG-X-FULL-SOURCE.zip -d /tmp/lvngx
          cp -a /tmp/lvngx/LVNG-X/. .
          rm -f .github/workflows/android-build.yml
          rm -rf /tmp/lvngx
          rm LVNG-X-FULL-SOURCE.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract LVNG-X Android source"
          git push
          
